# Render Blueprint for IMovies Platform
# Supports deploying both Backend Web Service and Frontend Static Site on Render

services:
  # 1. Backend Express REST API
  - type: web
    name: imovies-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # Set in Render Dashboard with MongoDB Atlas Connection String
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false

  # 2. Frontend React / Vite Static Site
  - type: static
    name: imovies-client
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: imovies-api
          property: host
